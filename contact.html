<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Contact Us - Learn Alphabet</title>
  <style>
    /* (Same CSS from your homepage, reused as is for consistency) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f9ff;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #00796b;
      color: white;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav.top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    ul.nav-links {
      list-style: none;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    ul.nav-links li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    ul.nav-links li a:hover,
    ul.nav-links li a.active {
      background-color: #004d40;
    }

    .container {
      display: flex;
      flex: 1;
    }

    .sidebar {
      width: 200px;
      background-color: #cbf3f1;
      padding: 20px;
      position: fixed;
      height: 100vh;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      margin-bottom: 10px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: #00796b;
      font-weight: 600;
      display: block;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .sidebar ul li a:hover {
      background-color: #b2dfdb;
    }

    main {
      flex: 1;
      padding: 40px;
    }

    main h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.8em;
    }

    form {
      background: #e3f2fd;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0d47a1;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #90caf9;
      border-radius: 8px;
      font-size: 1em;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: #1976d2;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: #1976d2;
      color: white;
      font-size: 1.1em;
      padding: 14px 0;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-weight: 700;
    }

    button:hover {
      background-color: #0d47a1;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .sidebar ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- Top Navigation Bar -->
  <header>
    <nav class="top-nav">
      <div class="logo">Alphabet Learning Page</div>
      <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="aboutus.html">About Us</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
        <li><a href="registration.html">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li><a href="chart.html">Chart</a></li>
        <li><a href="individual.html">Individual</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="video.html">Video</a></li>
        <li><a href="game.html">Game</a></li>
        <li><a href="printable.html">Printable</a></li>
      </ul>
    </aside>

    <!-- Main Contact Form -->
    <main>
      <h1>Contact Us</h1>
      <form action="#" method="post" onsubmit="return validateForm()">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required />

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" />

        <label for="message">Message *</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </main>
  </div>

  <script>
    function validateForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

      if (!name || !email || !message) {
        alert('Please fill out all required fields.');
        return false;
      }

      if (!emailPattern.test(email)) {
        alert('Please enter a valid email address.');
        return false;
      }

      alert('Thank you for your message!');
      return true;
    }
  </script>
</body>

</html>
